[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-sdk"
version = "0.4.18"
description = "Framework Python para bots do Nexus"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = ["playwright>=1.50,<2"]
desktop = ["pywinauto>=0.6.8,<1; platform_system == 'Windows'", "pywin32>=306; platform_system == 'Windows'"]
excel = ["openpyxl>=3.1,<4"]
email = []  # SMTP, IMAP and MIME are provided by Python's standard library.
sap = ["pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
nexus = "nexus_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_sdk = ["py.typed"]
