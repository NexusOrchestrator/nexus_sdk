[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-sdk"
version = "0.4.14"
description = "Framework Python para bots do Nexus"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nexus = "nexus_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_sdk = ["py.typed"]
